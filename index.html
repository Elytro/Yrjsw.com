    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #fff;
            font-family: "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        .wrapper {
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            width: 100%;

        }
        .login-logo {

        }
        .login-logo .fa-stack {

        }
        .login-logo h2 {
            font-size: 20px;
            font-weight: 400;
            color: #555;
            margin-top: 10px;
            letter-spacing: 2px;
        }
        .login-logo .subtitle {
            font-size: 13px;
            color: #aaa;
            margin-top: 4px;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }
        .form-group .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #bbb;
            z-index: 10;
            font-size: 15px;
        }
        .form-control {
            height: 46px;
            border-radius: 23px;
            border: 1px solid #e0e0e0;
            padding-left: 42px;
            padding-right: 16px;
            font-size: 14px;
            box-shadow: none;
            background: #fafafa;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-control:focus {
            border-color: #7ec8e3;
            box-shadow: 0 0 0 3px rgba(126, 200, 227, 0.15);
            background: #fff;
        }
        .btn-login {
            width: 100%;
            height: 46px;
            border-radius: 23px;
            background: #7ec8e3;
            border: none;
            color: #fff;
            font-size: 15px;
            letter-spacing: 3px;
            transition: background 0.3s, box-shadow 0.3s;
            margin-top: 6px;
        }
        .btn-login:hover,
        .btn-login:focus {
            background: #5eb8d6;
            color: #fff;
            outline: none;
            box-shadow: 0 4px 12px rgba(126, 200, 227, 0.35);
        }
        .btn-login:active {
            background: #4aa8c8;
        }
        .login-extra {
            text-align: center;
            margin-top: 18px;
        }
        .login-extra a {
            font-size: 13px;
            color: #aaa;
            text-decoration: none;
            transition: color 0.3s;
        }
        .login-extra a:hover {

            text-decoration: none;
        }
        .footer a:hover {
            color: #aaa;
        }

            .login-box {

                padding: 0 10px;
            }
            .login-logo h2 {

            }
